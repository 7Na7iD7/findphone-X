name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Checksums
        run: |
          shasum -a 256 build/app/outputs/flutter-apk/app-release.apk > checksums.txt
          shasum -a 256 build/app/outputs/bundle/release/app-release.aab >> checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            findphone X — نسخه اندروید.

            APK را روی گوشی نصب کن، یا AAB را برای انتشار در Play Store استفاده کن.
            برای اسکن بلوتوث نیاز به مجوز بلوتوث و موقعیت مکانی دارد.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "findphone X $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            checksums.txt

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/app/release.keystore android/key.properties
